<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmI | Cognitive Interface</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c;
            --surface: rgba(255, 255, 255, 0.05);
            --primary: #6366f1;
            --accent: #8b5cf6;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --glow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: grid;
            grid-template-columns: 350px 1fr;
            overflow: hidden;
        }

        /* SIDEBAR */
        aside {
            background: rgba(10, 10, 12, 0.8);
            border-right: 1px solid var(--surface);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .status-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .status-label {
            color: var(--text-dim);
        }

        .status-value {
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .mood-bars {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .mood-bar-container {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .mood-bar {
            height: 100%;
            background: var(--primary);
            transition: width 0.5s ease;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* MAIN CONTENT */
        main {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* TERMINAL PANEL */
        .terminal {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-dim);
            background: rgba(0, 0, 0, 0.2);
            scroll-behavior: smooth;
        }

        .terminal-line {
            margin-bottom: 0.25rem;
            animation: fadeIn 0.3s ease;
        }

        .terminal-line.discovery {
            color: var(--success);
        }

        .terminal-line.request {
            color: var(--primary);
            font-weight: 500;
        }

        .terminal-line.error {
            color: var(--danger);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* CHAT PANEL */
        .chat-container {
            border-top: 1px solid var(--surface);
            padding: 2rem;
            background: rgba(10, 10, 12, 0.5);
            backdrop-filter: blur(20px);
        }

        .chat-responses {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            padding: 1rem;
            border-radius: 12px;
            max-width: 80%;
        }

        .message.user {
            align-self: flex-end;
            background: var(--primary);
            color: white;
        }

        .message.ai {
            align-self: flex-start;
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-group {
            display: flex;
            gap: 1rem;
        }

        input {
            flex: 1;
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 1rem;
            border-radius: 12px;
            font-family: inherit;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        /* CUSTOM SCROLLBAR */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>
    <aside>
        <div class="logo">AmI ENGINE</div>

        <div class="status-card">
            <div class="status-item">
                <span class="status-label">State</span>
                <span class="status-value" id="state-val">IDLE</span>
            </div>
            <div class="status-item">
                <span class="status-label">Reactive Mode</span>
                <span class="status-value" style="color: var(--success)">ACTIVE</span>
            </div>
            <div class="status-item">
                <span class="status-label">Concepts</span>
                <span class="status-value" id="concepts-val">0</span>
            </div>

            <div class="mood-bars">
                <div class="status-label" style="font-size: 0.75rem; margin-bottom: 0.2rem">Curiosity</div>
                <div class="mood-bar-container">
                    <div id="curiosity-bar" class="mood-bar" style="width: 0%"></div>
                </div>

                <div class="status-label" style="font-size: 0.75rem; margin-bottom: 0.2rem; margin-top: 0.5rem">Anxiety
                </div>
                <div class="mood-bar-container">
                    <div id="anxiety-bar" class="mood-bar" style="width: 0%; background: var(--danger)"></div>
                </div>

                <div class="status-label" style="font-size: 0.75rem; margin-bottom: 0.2rem; margin-top: 0.5rem">Focus
                </div>
                <div class="mood-bar-container">
                    <div id="focus-bar" class="mood-bar" style="width: 0%; background: var(--success)"></div>
                </div>
            </div>
        </div>

        <button id="learn-btn" class="btn" onclick="startLearning()">INITIATE LEARNING</button>
        <button class="btn btn-outline" onclick="clearMemory()">PURGE CACHE</button>

        <div style="margin-top: auto; font-size: 0.7rem; color: var(--text-dim); text-align: center;">
            Autonomous Predictive Curiosity v1.0<br>
            C++ Reasoning Engine + Python Bridge
        </div>
    </aside>

    <main>
        <div class="terminal" id="terminal">
            <div class="terminal-line">System ready. Waiting for initialization...</div>
        </div>

        <div class="chat-container">
            <div class="chat-responses" id="chat-responses">
                <div class="message ai">Hello. I am AmI. I can synthesize knowledge and explore the unknown. What shall
                    we discuss?</div>
            </div>
            <div class="input-group">
                <input type="text" id="chat-input" placeholder="Query the cognitive core..."
                    onkeypress="handleKey(event)">
                <button class="btn" onclick="sendMessage()">SEND</button>
            </div>
        </div>
    </main>

    <script>
        const terminal = document.getElementById('terminal');
        const chatResponses = document.getElementById('chat-responses');
        const chatInput = document.getElementById('chat-input');
        const learnBtn = document.getElementById('learn-btn');

        async function updateStatus() {
            try {
                const res = await fetch('/status');
                const data = await res.json();

                document.getElementById('state-val').innerText = data.is_learning ? 'LEARNING' : 'IDLE';
                document.getElementById('concepts-val').innerText = data.concepts_count;

                // Update mood bars
                document.getElementById('curiosity-bar').style.width = Math.min(100, data.current_mood.curiosity * 20) + '%';
                document.getElementById('anxiety-bar').style.width = Math.min(100, data.current_mood.anxiety * 100) + '%';
                document.getElementById('focus-bar').style.width = Math.min(100, data.current_mood.focus * 100) + '%';

                learnBtn.disabled = data.is_learning;
                learnBtn.innerText = data.is_learning ? 'PROCESSING...' : 'INITIATE LEARNING';

                // Sync terminal logs
                const currentLines = terminal.querySelectorAll('.terminal-line').length;
                if (data.logs.length > currentLines - 1) {
                    // Only add new lines
                    const newLogs = data.logs.slice(currentLines - 1);
                    newLogs.forEach(log => {
                        const div = document.createElement('div');
                        div.className = 'terminal-line';
                        if (log.includes('Autonomous Discovery')) div.classList.add('discovery');
                        if (log.includes('RESEARCH_REQUEST')) div.classList.add('request');
                        if (log.includes('Error')) div.classList.add('error');
                        div.innerText = log;
                        terminal.appendChild(div);
                    });
                    terminal.scrollTop = terminal.scrollHeight;
                }
            } catch (e) { console.error("Poll error", e); }
        }

        setInterval(updateStatus, 1000);

        async function startLearning() {
            await fetch('/train', { method: 'POST' });
            terminal.innerHTML = '<div class="terminal-line">Initialization command sent to core...</div>';
        }

        async function sendMessage() {
            const msg = chatInput.value.trim();
            if (!msg) return;

            // Add user message to UI
            addMessage(msg, 'user');
            chatInput.value = '';

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                const data = await res.json();
                addMessage(data.response || "I could not formulate a response.", 'ai');
            } catch (e) {
                addMessage("Communication Error with Core.", 'ai');
            }
        }

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerText = text;
            chatResponses.appendChild(div);
            chatResponses.scrollTop = chatResponses.scrollHeight;
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function clearMemory() {
            if (confirm("This will purge the current knowledge base. Continue?")) {
                // Implementation for clearing would go here - for now just UI feedback
                alert("Memory purge request sent to kernel.");
            }
        }
    </script>
</body>

</html>
